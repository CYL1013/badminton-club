<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf9f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="羽球報名">
<link rel="manifest" href="signup.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>羽球報名</title>
<style>
:root{
  --bg:#faf9f6; --card:#ffffff; --ink:#2b2b28; --muted:#8c8a83; --line:#ebe8e1;
  --accent:#5f7f6b; --accent-soft:#eef3ef; --warn:#b4685a; --warn-soft:#f8eeeb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  min-height:100svh;padding:0 16px calc(32px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:460px;margin:0 auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}
h1{font-size:15px;font-weight:500;letter-spacing:.08em;margin:0;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.label{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:0 0 6px}
.big{font-size:26px;font-weight:600;line-height:1.25;margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.btn{display:block;width:100%;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:16px;font-weight:500;padding:13px 16px;border-radius:10px;cursor:pointer;margin-top:16px}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);letter-spacing:.05em;outline:none}
input[type=text]:focus{border-color:var(--ink)}
.msg{font-size:14px;margin:10px 0 0;color:var(--warn)}
.status{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-top:10px}
.status.wait{background:var(--warn-soft);color:var(--warn)}
.names{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.names li{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.names li i{font-style:normal;color:var(--muted);min-width:1.9em;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.names li span{min-width:0;overflow-wrap:anywhere}
.names li.me{font-weight:600}
.names li.wait{color:var(--muted)}
.hd{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:16px 0 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:12px}
th{font-weight:400;font-size:12px;color:var(--muted);text-align:right;padding:0 0 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum{margin-top:14px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.sum .muted{color:var(--muted);font-size:14px}
.sum .total{border-top:1px solid var(--ink);margin-top:6px;padding-top:12px;font-weight:600;font-size:17px}
.result{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:15px;text-align:center}
.result.owe{background:var(--warn-soft);color:var(--warn)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:20px;line-height:1.7}
.empty{color:var(--muted);font-size:15px;margin:10px 0 0}
.login{padding-top:18vh}
.login h2{font-size:22px;font-weight:600;margin:0 0 4px}
.login p{color:var(--muted);font-size:14px;margin:0 0 22px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px}
.tabs button{font:inherit;font-size:14px;padding:10px 2px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rules{margin:12px 0 0;padding:0;list-style:none}
.rules li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rules li:last-child{border-bottom:none}
.fld{display:block;font-size:12px;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.ok{font-size:14px;margin:10px 0 0;color:var(--accent)}
.spin{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin">載入中…</div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* backend address comes from the link the organizer shares (?a=...), then is remembered on this phone */
function readApi(){
  const q=new URLSearchParams(location.search).get('a');
  if(q){
    try{
      const b=q.replace(/-/g,'+').replace(/_/g,'/');
      const url=decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4))));
      if(/^https:\/\/script\.google\.com\//.test(url)){LS.set('su_api',url);return url}
    }catch(e){}
  }
  return LS.get('su_api');
}
const API=readApi();
let code=LS.get('su_code')||'';
let codeOk='';let view=null,busy=false,err='',loginErr='',stamp=0,mode='login',regErr='',codeErr='',nameErr='',nameOk='',tab='play',joinErr='';

let seq=0;
function jsonp(params,ms){
  return new Promise((resolve,reject)=>{
    const cb='su_cb_'+(seq++)+'_'+Date.now();
    const qs=Object.entries({...params,callback:cb}).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    const sc=document.createElement('script');let done=false;
    const t=setTimeout(()=>{if(done)return;done=true;clean();reject({kind:'timeout'})},ms||15000);
    function clean(){try{delete window[cb]}catch(e){window[cb]=undefined}sc.remove();clearTimeout(t)}
    window[cb]=d=>{if(done)return;done=true;clean();resolve(d)};
    sc.onerror=()=>{if(done)return;done=true;clean();reject({kind:'network'})};
    sc.src=API+(API.includes('?')?'&':'?')+qs;
    document.head.appendChild(sc);
  });
}

async function call(params){
  try{
    const j=await jsonp(params);
    if(!j)throw {kind:'network'};
    return j;
  }catch(e){return {ok:false,error:e.kind||'network'}}
}

async function login(c,silent){
  const j=await call({action:'mlogin',code:c});
  if(j.ok){code=c;LS.set('su_code',c);view=j;stamp=Date.now();err='';loginErr='';render();return true}
  if(j.error==='bad_code'){
    if(silent){LS.del('su_code');code='';view=null}
    loginErr='找不到這個代碼，請再確認一次，或問主辦人。';render();return false;
  }
  if(silent&&view){err='目前連不上，顯示的是先前的資料。';render();return false}
  loginErr='連不上伺服器，請檢查網路後再試一次。';render();return false;
}

async function sign(on){
  if(busy||!view||!view.event)return;
  busy=true;err='';render();
  const j=await call({action:'msign',code,date:view.event.date,on:on?'1':'0'});
  busy=false;
  if(j.ok){view=j;stamp=Date.now()}
  else if(j.error==='closed')err='報名已經關閉了。';
  else if(j.error==='no_event')err='活動已更新，請重新整理後再試。';
  else if(j.error==='bad_code')err='代碼失效了，請重新登入。';
  else err='網路不穩，這次沒有成功，請再按一次。';
  render();
  if(!j.ok&&(j.error==='no_event'))login(code,true);
}

async function changeCode(nc){
  const j=await call({action:'mcode',code,ncode:nc});
  if(j.ok){code=nc;LS.set('su_code',nc);view=j;stamp=Date.now();codeErr='';codeOk='代碼已更新，下次登入請用新代碼。';return true}
  codeErr=({bad_code_fmt:'代碼只能是 3～12 位數字，不能有文字或符號。',same_code:'這和你現在的代碼一樣，請輸入新的。',
    code_taken:'這個代碼已經有人用了，請換一個。',bad_code:'目前的代碼失效了，請重新登入。'})[j.error]||'連不上伺服器，請檢查網路後再試一次。';
  return false;
}
async function changeName(n){
  const j=await call({action:'mname',code,name:n});
  if(j.ok){view=j;stamp=Date.now();nameErr='';nameOk='名字已更新。';return true}
  nameOk='';nameErr=({bad_input:'請填名字（20 字內）。',name_taken:'這個名字已經有人用了。',bad_code:'代碼失效了，請重新登入。'})[j.error]||'連不上伺服器，請檢查網路後再試一次。';
  return false;
}
async function joinSeason(){
  if(busy)return;busy=true;joinErr='';render();
  const j=await call({action:'mmember',code});busy=false;
  if(j.ok){view=j;stamp=Date.now()}
  else joinErr=({members_full:'季費會員名額已經滿了，目前無法報名。',already_member:'你已經是季費會員了。',not_confirmed:'主辦人還沒確認你的名字，確認後才能報名會員。',bad_code:'代碼失效了，請重新登入。'})[j.error]||'連不上伺服器，請再按一次。';
  render();
}
function logout(){codeErr='';LS.del('su_code');code='';view=null;loginErr='';mode='login';render()}

async function register(name,c){
  const j=await call({action:'mreg',code:c,name});
  if(j.ok){code=c;LS.set('su_code',c);view=j;stamp=Date.now();regErr='';mode='login';return true}
  regErr=({bad_input:'請填名字（20 字內）。',bad_code_fmt:'代碼只能是 3～12 位數字，不能有文字或符號。',code_taken:'這個代碼已經有人用了，請換一個。',
    name_taken:'這個名字已經註冊過了。如果是你，請直接用你的代碼登入；忘記代碼請問主辦人。',
    full:'目前註冊人數太多，請聯絡主辦人。'})[j.error]||'連不上伺服器，請檢查網路後再試一次。';
  return false;
}

function loginHtml(){
  return `<div class="login">
    <h2>羽球社團報名</h2>
    <p>請輸入你的個人代碼</p>
    <form id="lf" autocomplete="off"><input type="text" id="code" placeholder="個人代碼（數字）" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" enterkeyhint="go" value="${esc(code)}">
    <button class="btn" type="submit"${busy?' disabled':''}>${busy?'登入中…':'登入'}</button></form>
    ${loginErr?`<p class="msg">${esc(loginErr)}</p>`:''}
    <button class="link" type="button" data-a="toReg" style="margin-top:18px">第一次使用？註冊</button>
    <p class="foot" style="text-align:left;margin-top:12px">忘記代碼，請聯絡主辦人。</p>
  </div>`;
}
function regHtml(){
  return `<div class="login">
    <h2>註冊</h2>
    <p>填名字、自己取一組數字當代碼，之後就用代碼登入</p>
    <form id="rf" autocomplete="off">
      <input type="text" id="rname" placeholder="你的名字" maxlength="20" autocomplete="off" style="margin-bottom:10px">
      <input type="text" id="rcode" placeholder="自己取一組數字代碼（3～12 位）" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off">
      <button class="btn" type="submit"${busy?' disabled':''}>${busy?'註冊中…':'註冊並登入'}</button>
    </form>
    ${regErr?`<p class="msg">${esc(regErr)}</p>`:''}
    <button class="link" type="button" data-a="toLogin" style="margin-top:18px">已經有代碼？回登入</button>
    <p class="foot" style="text-align:left;margin-top:12px">註冊後就能先報名。主辦人確認你的名字後，才會出現出席與費用紀錄。</p>
  </div>`;
}

function eventHtml(v){
  const ev=v.event;
  if(!ev)return `<section class="card"><p class="label">下次活動</p><p class="big">目前沒有開放的活動</p><p class="sub">主辦人排好下一場後，這裡就會出現。</p></section>`;
  const main=v.list.filter(x=>x.status==='main'),wait=v.list.filter(x=>x.status==='wait');
  const cap=ev.cap||8;
  let status='',btn='';
  if(v.myStatus==='main')status=`<span class="status">已報名・正取第 ${v.myPos} 位</span>`;
  else if(v.myStatus==='wait')status=`<span class="status wait">備取第 ${v.myPos} 位${v.prio&&v.prio.active&&v.me.role!=='member'?`（${esc(v.prio.label)} 前季費成員優先，之後依報名順序）`:'（有人取消會自動遞補）'}</span>`;
  if(!ev.open)btn=`<button class="btn ghost" disabled>報名已關閉</button>`;
  else if(v.myStatus)btn=`<button class="btn ghost" data-a="cancel"${busy?' disabled':''}>${busy?'處理中…':'取消報名'}</button>`;
  else btn=`<button class="btn" data-a="join"${busy?' disabled':''}>${busy?'處理中…':(main.length>=cap?'報名（目前額滿，將列入備取）':'我要報名')}</button>`;
  const li=(x,i,w)=>`<li class="${x.me?'me ':''}${w?'wait':''}"><i>${w?'備'+(i+1):i+1}</i><span>${esc(x.name)}</span></li>`;
  return `<section class="card">
    <p class="label">下次活動</p>
    <p class="big">${esc(ev.label||ev.date)}</p>
    <p class="sub">已報名 ${main.length} / ${cap} 人${wait.length?`，備取 ${wait.length} 人`:''}</p>
    ${v.prio?`<p class="sub" style="font-size:13px">${v.prio.active?`季費成員 ${esc(v.prio.label)} 前報名可優先正取，臨打先列備取；之後依報名順序。`:`已依報名順序排序。`}</p>`:''}
    ${status?`<div>${status}</div>`:''}
    ${btn}
    ${err?`<p class="msg">${esc(err)}</p>`:''}
    ${v.list.length?`<ul class="names">${main.map((x,i)=>li(x,i,false)).join('')}${wait.map((x,i)=>li(x,i,true)).join('')}</ul>`:'<p class="empty">還沒有人報名，你可以當第一個。</p>'}
  </section>`;
}

function recordHtml(v){
  const m=v.me,r=v.rates||{},ss=v.sessions||{};
  if(m.pending)return `<section class="card"><p class="label">我的紀錄</p><p class="big" style="font-size:20px">等主辦人確認中</p><p class="sub">你已經註冊成功，可以先報名。主辦人確認你的名字後，出席與費用紀錄就會顯示在這裡。</p></section>`;
  const isMember=m.role==='member';
  const ballOwed=m.ballPaid?0:m.ball;
  const rows=(m.rows||[]);
  const table=rows.length?`<table><thead><tr><th>日期</th><th>場地費</th><th>球錢</th><th>小計</th></tr></thead><tbody>${
    rows.map(x=>`<tr><td>${esc(x.d)}</td><td>${money(r.fee||0)}</td><td>${money(x.ball)}</td><td>${money((r.fee||0)+x.ball)}</td></tr>`).join('')
  }</tbody></table>`:'<p class="empty">這一季你還沒有出席紀錄。</p>';
  const b=m.balance;
  let result;
  if(m.done)result=`<div class="result">已結清，謝謝！</div>`;
  else if(b<0)result=`<div class="result owe">目前還需補繳 ${money(-b)}</div>`;
  else if(b>0)result=`<div class="result">${isMember?`目前結餘 ${money(b)}（還可以打 ${m.remain>0?m.remain:0} 次）`:`目前多繳 ${money(b)}`}</div>`;
  else result=`<div class="result">目前剛好結清</div>`;
  return `<section class="card">
    <p class="label">我的紀錄・${esc(v.season)}</p>
    <p class="big">出席 ${m.att} 次<span style="font-size:15px;font-weight:400;color:var(--muted)"> ／ 本季共 ${ss.total||0} 次${ss.played!=null?`，已打 ${ss.played} 次`:''}</span></p>
    <p class="sub">${isMember?'季費會員':'臨打'}　場地費每次 ${money(r.fee||0)}，球錢依當天用球數與人數平分</p>
    ${table}
    <div class="sum">
      <div><span>場地費合計</span><span>${money(m.court)}</span></div>
      <div><span>球錢合計${m.ballPaid?'（已另外繳）':''}</span><span>${money(m.ball)}</span></div>
      <div class="total"><span>應付合計</span><span>${money(m.court+ballOwed)}</span></div>
      <div class="muted"><span>${isMember?'季費已繳':'已付'}</span><span>${money(m.paid)}</span></div>
      ${m.carry?`<div class="muted"><span>上季結轉</span><span>${m.carry>0?'+':'−'}${money(Math.abs(m.carry))}</span></div>`:''}
    </div>
    ${result}
  </section>`;
}

function memberHtml(v){
  const m=v.me,r=v.rates||{},ms=v.members||{count:0,cap:r.cap||8},ss=v.sessions||{};
  const cap=ms.cap||8,full=ms.count>=cap,isM=m.role==='member';
  const total=ss.total||0;
  let act;
  if(isM)act=`<div class="result">你是本季的季費會員</div>`;
  else if(m.pending)act=`<button class="btn ghost" disabled>主辦人確認你的名字後才能報名</button>`;
  else if(ms.requested)act=`<div class="result">已報名成為會員，請向主辦人繳季費</div>`;
  else if(full)act=`<button class="btn ghost" disabled>名額已滿（${ms.count} / ${cap}）</button>`;
  else act=`<button class="btn" data-a="join-member"${busy?' disabled':''}>${busy?'處理中…':'報名成為季費會員'}</button>`;
  return `<section class="card"><p class="label">本季季費會員</p>
    <p class="big">${ms.count} / ${cap} 人</p>
    <p class="sub">${full?'名額已滿，不再收新會員。':`還有 ${cap-ms.count} 個名額，滿 ${cap} 人就不再收。`}</p></section>
  <section class="card"><p class="label">會員規則</p>
    <ul class="rules">
      <li>每週打一次，本季共 ${total||'—'} 次，每次場地 2 小時。</li>
      <li>季費預繳：每次 ${money(r.fee||0)} × ${total||'—'} 次${total?` ＝ ${money((r.fee||0)*total)}`:''}。</li>
      <li>沒來的那次，費用不會扣，會留在你的結餘裡。</li>
      <li>球錢另計，由當天出席的人平分，季末一起結算。</li>
      <li>報名優先：打球日前最後一個週五 23:59 前，會員先報先排正取；臨打會排在備取。過了之後，依報名先後排順序。</li>
      <li>臨打每次 ${money(r.fee||0)}，不用預繳。</li>
      <li>會員名額 ${cap} 人，額滿後不再收。</li>
    </ul>
    ${act}${joinErr?`<p class="msg">${esc(joinErr)}</p>`:''}
  </section>`;
}
function profileHtml(v){
  const m=v.me,isM=m.role==='member';
  return `<section class="card"><p class="label">成員資料</p>
    <form id="nf" autocomplete="off"><label class="fld" for="nname" style="margin-top:0">姓名</label>
    <input type="text" id="nname" maxlength="20" autocomplete="off" value="${esc(m.name)}">
    <button class="btn" type="submit"${busy?' disabled':''}>儲存姓名</button></form>
    ${nameErr?`<p class="msg">${esc(nameErr)}</p>`:''}${nameOk?`<p class="ok">${esc(nameOk)}</p>`:''}
  </section>
  <section class="card"><p class="label">個人代碼</p>
    <form id="cf" autocomplete="off"><label class="fld" for="ncode" style="margin-top:0">新代碼（3～12 位數字）</label>
    <input type="text" id="ncode" placeholder="輸入新代碼" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off">
    <button class="btn" type="submit"${busy?' disabled':''}>${busy?'儲存中…':'儲存新代碼'}</button></form>
    ${codeErr?`<p class="msg">${esc(codeErr)}</p>`:''}${codeOk?`<p class="ok">${esc(codeOk)}</p>`:''}
    <p class="sub" style="font-size:13px">改完之後，下次登入要用新代碼。</p>
  </section>
  <section class="card"><p class="label">身分</p>
    <p class="big" style="font-size:20px">${m.pending?'等主辦人確認':isM?'季費會員':'臨打'}</p>
    <p class="sub">${isM?'要改成臨打，請聯絡主辦人。':'想成為季費會員，請到「季費會員」頁報名。'}</p>
  </section>`;
}
function mainHtml(){
  const v=view;
  const t=v.updated?new Date(v.updated).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const tabs=[['play','打球報名'],['member','季費會員'],['record','出勤紀錄'],['profile','成員資料']];
  const body=tab==='member'?memberHtml(v):tab==='record'?recordHtml(v):tab==='profile'?profileHtml(v):eventHtml(v);
  return `<div class="top"><h1 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.me.name)}</h1><button class="link" data-a="logout">登出</button></div>
    <div class="tabs">${tabs.map(([k,l])=>`<button type="button" class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</div>
    ${body}
    ${!v.event&&err&&tab==='play'?`<p class="msg">${esc(err)}</p>`:''}
    <p class="foot">出席與費用由主辦人更新${t?`（最後更新 ${esc(t)}）`:''}<br>如有疑問請直接問主辦人</p>`;
}

function render(){
  const app=$('#app');
  const typed=$('#code')?$('#code').value:null;
  const typedNC=$('#ncode')?$('#ncode').value:null,typedNN=$('#nname')?$('#nname').value:null;
  const typedN=$('#rname')?$('#rname').value:null,typedC=$('#rcode')?$('#rcode').value:null;
  if(!API){app.innerHTML=`<div class="login"><h2>羽球社團報名</h2><p>請用主辦人傳給你的連結開啟這個頁面。</p></div>`;return}
  app.innerHTML=view?mainHtml():(mode==='reg'?regHtml():loginHtml());
  if(typed!=null&&$('#code'))$('#code').value=typed;
  if(typedNC!=null&&$('#ncode'))$('#ncode').value=typedNC;
  if(typedNN!=null&&$('#nname'))$('#nname').value=typedNN;
  if(typedN!=null&&$('#rname'))$('#rname').value=typedN;
  if(typedC!=null&&$('#rcode'))$('#rcode').value=typedC;
}

document.addEventListener('input',e=>{if(e.target.id==='code'||e.target.id==='rcode'||e.target.id==='ncode'){const v=e.target.value.replace(/\D/g,'');if(v!==e.target.value)e.target.value=v}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='nf'){
    e.preventDefault();
    const n=$('#nname').value.replace(/\s+/g,' ').trim();
    if(!n){nameErr='請填名字（20 字內）。';nameOk='';render();return}
    if(n===view.me.name){nameErr='';nameOk='名字沒有變。';render();return}
    busy=true;nameErr='';nameOk='';codeErr='';codeOk='';render();$('#nname').value=n;
    await changeName(n);busy=false;render();return;
  }
  if(e.target.id==='cf'){
    e.preventDefault();
    const nc=$('#ncode').value.trim();
    if(!/^\d{3,12}$/.test(nc)){codeErr='代碼只能是 3～12 位數字，不能有文字或符號。';render();return}
    busy=true;codeErr='';codeOk='';nameErr='';nameOk='';render();$('#ncode').value=nc;
    await changeCode(nc);busy=false;render();return;
  }
  if(e.target.id==='rf'){
    e.preventDefault();
    const n=$('#rname').value.trim(),c=$('#rcode').value.trim();
    if(!n||!c){regErr='名字和代碼都要填。';render();return}
    if(!/^\d{3,12}$/.test(c)){regErr='代碼只能是 3～12 位數字，不能有文字或符號。';render();return}
    busy=true;regErr='';render();$('#rname').value=n;$('#rcode').value=c;
    await register(n,c);busy=false;render();return;
  }
  if(e.target.id!=='lf')return;e.preventDefault();
  const c=$('#code').value.trim();if(!c)return;
  busy=true;loginErr='';render();$('#code').value=c;
  await login(c,false);busy=false;render();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='join')sign(true);else if(a==='cancel')sign(false);else if(a==='logout')logout();
  else if(a==='tab'){tab=b.dataset.v;codeErr='';codeOk='';nameErr='';nameOk='';joinErr='';render();window.scrollTo(0,0)}else if(a==='join-member')joinSeason();
  else if(a==='toReg'){mode='reg';regErr='';render()}else if(a==='toLogin'){mode='login';loginErr='';render()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&code&&view&&Date.now()-stamp>15000)login(code,true)});
setInterval(()=>{if(document.visibilityState==='visible'&&code&&view&&!busy)login(code,true)},45000);

render();
if(API&&code)login(code,true);
</script>
</body>
</html>
