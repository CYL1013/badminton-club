<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>羽球季費帳本</title>
<meta name="description" content="羽球社團的季費、臨打收費與球錢管理">
<meta name="theme-color" content="#1c6a47">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="羽球帳本">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3ef; --surface:#ffffff; --ink:#15231b; --muted:#5a6b61; --line:#d4ded7;
  --court:#1c6a47; --court-ink:#ffffff; --court-soft:#dcebe2;
  --cork:#9c5f22; --cork-soft:#f4e7d8;
  --warn:#b8361f; --warn-soft:#fbe5df; --good:#1f7446; --good-soft:#dff0e5; --chip:#e6eee8;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1511; --surface:#16201a; --ink:#e4ece6; --muted:#90a197; --line:#283730;
  --court:#4cb584; --court-ink:#0b1510; --court-soft:#1c3328;
  --cork:#d69a5a; --cork-soft:#33261a;
  --warn:#f07158; --warn-soft:#3a1d17; --good:#5cc38b; --good-soft:#173324; --chip:#1f2c24; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:19px;font-weight:700;letter-spacing:.02em}
h2{font-size:16px;font-weight:700}
h3{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:6px 10px;border-bottom:3px double var(--court)}
.top .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=date],input[type=number],input[type=password],input[type=url],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.6}
#sync{font-size:12px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
details.card>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::after{content:"＋";color:var(--court)}
details.card[open]>summary::after{content:"－"}
details.card[open]>summary{margin-bottom:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.pri{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.ghost{background:transparent}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;text-align:center;line-height:1.15;position:relative}
.dchip .num{font-size:18px;display:block}
.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.dchip.on small{color:inherit;opacity:.8}
.dchip.has::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--cork)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--chip);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--num);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert{background:var(--warn-soft)} .stat.alert b{color:var(--warn)}
.stat.extra{background:var(--good-soft)} .stat.extra b{color:var(--good)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
ul.list li:first-child{border-top:0}
.nm{font-weight:500;flex:1 1 auto;min-width:5em}
.idx{font-family:var(--num);color:var(--muted);width:1.4em;text-align:right}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.m{background:var(--court-soft);color:var(--court)}
.tag.new{background:var(--cork-soft);color:var(--cork)}
.pay{border-radius:99px;padding:3px 11px;font-size:13px;border:1px solid}
.pay.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pay.due{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
input.amt{width:4.6em;text-align:right;padding:4px 6px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}

.hol{color:var(--cork);margin-left:4px;font-size:11px}
.chip.skipped{border-style:solid;background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.skipped .hol{color:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:13px}
.chip:hover{border-color:var(--court);color:var(--court)}

.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.stepper .num{font-size:30px;min-width:1.6em;text-align:center}
.cork{color:var(--cork)}

.parse-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.parse-row select{max-width:12em}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.g{border-collapse:collapse;font-size:13px;white-space:nowrap}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:0;text-align:center}
table.g th{font-weight:500;color:var(--muted);font-size:12px;padding:6px 4px}
table.g th.dh{cursor:pointer}
table.g th.dh:hover{color:var(--court)}
table.g .first{position:sticky;left:0;background:var(--surface);text-align:left;padding:6px 10px;z-index:1;border-right:1px solid var(--line)}
table.g td.c{width:44px;height:32px;cursor:pointer;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px}
table.g td.c.att{color:var(--court)}
table.g td.c.paid{background:var(--good-soft);color:var(--good)}
table.g td.c.due{background:var(--warn-soft);color:var(--warn);font-weight:700}
table.g td.sum{font-family:var(--num);font-variant-numeric:tabular-nums;padding:6px 8px;font-size:15px}
table.g tr.sep td,table.g tr.sep th{border-top:2px solid var(--court)}
table.g tfoot td{color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

.pform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:10px 0 4px;width:100%}
.pform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pform input,.pform select{color:var(--ink);font-size:15px}
.expand{cursor:pointer}
.right{margin-left:auto;text-align:right}

.bal{font-family:var(--num);font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--good)} .neg{color:var(--warn)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .figs{font-size:12px;color:var(--muted);grid-column:1/-1}
.srow .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.srow.done{opacity:.55}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 11px;font-size:13px}
.seg button.on{background:var(--court);color:var(--court-ink)}
.hint{font-size:13px}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.note{font-size:13px;color:var(--muted);background:var(--chip);border-radius:8px;padding:8px 10px}
.warnnote{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px}
.totals{display:flex;gap:16px;flex-wrap:wrap}

nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav#tabs .in{display:flex;width:100%;max-width:760px}
nav#tabs button{flex:1;border:0;background:transparent;padding:9px 2px 10px;font-size:13px;color:var(--muted);border-top:3px solid transparent}
nav#tabs button.on{color:var(--court);border-top-color:var(--court);font-weight:700}
#undo{position:fixed;right:12px;bottom:calc(108px + env(safe-area-inset-bottom,0px));background:var(--card,#fff);color:var(--ink);border:1px solid var(--line,#ccc);padding:8px 14px;border-radius:99px;font-size:13px;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:6;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

/* gate / loading */
#crash{min-height:100svh;padding:24px max(16px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
#crash h1{font-size:17px;color:var(--warn)}
#crash pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--chip);padding:10px;border-radius:8px;max-height:40vh;overflow:auto;width:100%}
#gate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.gatecard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.gatecard h1{font-size:20px}
.gatecard label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.gatecard input{font-size:16px}
.gateerr{font-size:13px;color:var(--warn)}
.loading{min-height:100svh;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="crash" hidden></div>
<div id="app"></div>
<nav id="tabs" hidden><div class="in">
  <button data-act="tab" data-v="session">本週</button>
  <button data-act="tab" data-v="grid">出席表</button>
  <button data-act="tab" data-v="people">成員</button>
  <button data-act="tab" data-v="balls">羽球</button>
  <button data-act="tab" data-v="settle">結算</button>
</div></nav>
<div id="toast" hidden></div>
<button id="undo" type="button" data-act="undo" hidden>↶ 復原上一步</button>

<script>
const DEF={court:800,cap:8,fee:100,bucketPrice:600,perBucket:12};
let state=null, loaded=false, version=null, mode='loading';
let CFG=null;try{const t=localStorage.getItem('bm_cfg');CFG=t?JSON.parse(t):null}catch(e){CFG=null}
const ui={tab:'session',date:null,lineText:'',parse:null,open:null,ns:null,qd:null,centerDate:true,sm:'full'};
try{ui.tab=localStorage.getItem('bm_tab')||'session'}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const md=d=>{const p=d.split('-');return (+p[1])+'/'+(+p[2])};
const dt=d=>new Date(d+'T00:00:00Z');
const wd=d=>'日一二三四五六'[dt(d).getUTCDay()];
const addDays=(d,n)=>{const x=dt(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const money=n=>{n=Math.round(n);return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString()};
const signed=n=>{n=Math.round(n);return n===0?'$0':(n>0?'+':'−')+'$'+Math.abs(n).toLocaleString()};
const RATE_KEYS=['court','cap','fee','bucketPrice','perBucket'];
/* Each season keeps its own rates, so changing settings later never rewrites an older season's money. */
const rt=(k,s)=>{s=s||(state&&state.seasons&&state.seasons.length?S():null);const r=s&&s.rates;return r&&r[k]!=null?r[k]:state.settings[k]};
const fee=()=>rt('fee');
const ballPrice=()=>rt('bucketPrice')/rt('perBucket');
const norm=n=>String(n).replace(/\s+/g,'').toLowerCase();
function S(){return state.seasons.find(s=>s.id===state.cur)||state.seasons[state.seasons.length-1]}
const person=id=>state.people.find(p=>p.id===id)||{id,name:'(已刪除)',aliases:[]};
const pname=id=>person(id).name;
const isMember=(s,id)=>s.members.includes(id);
const getSess=(s,d)=>s.sessions[d]||{att:{},backup:[],balls:0};
function sess(s,d){if(!s.sessions[d])s.sessions[d]={att:{},backup:[],balls:0};const x=s.sessions[d];x.att=x.att||{};x.backup=x.backup||[];x.balls=x.balls||0;return x}
function gap(s,d){const n=Object.keys(getSess(s,d).att||{}).length;return n?Math.max(0,rt('court',s)-n*fee()):0}
function extra(s,d){const n=Object.keys(getSess(s,d).att||{}).length;return Math.max(0,n-rt('cap',s))*fee()}
function share(s,d){const x=getSess(s,d);const n=Object.keys(x.att||{}).length;if(!n)return 0;const tot=gap(s,d)+(x.balls||0)*ballPrice();return tot?Math.ceil(tot/n):0}
function memberFee(s,id){const v=s.memberFee[id];return v==null?s.dates.length*fee():v}
function income(s,d){const x=getSess(s,d);let t=0;for(const id in x.att)t+=isMember(s,id)?fee():(x.att[id].paid||0);return t}
function normalize(st){
  st=st||{};st.settings={...DEF,...(st.settings||{})};st.people=st.people||[];
  st.seasons=(st.seasons||[]).map(s=>({name:'',closed:false,dates:[],members:[],memberFee:{},feePaid:{},carry:{},sessions:{},purchases:[],settle:{},...s}));
  st.seasons.forEach(s=>{if(!s.rates)s.rates=Object.fromEntries(RATE_KEYS.map(k=>[k,st.settings[k]]))});
  if(!st.cur&&st.seasons.length)st.cur=st.seasons[st.seasons.length-1].id;
  return st;
}
function calc(s){
  const out={};const ids=[];const addId=id=>{if(!out[id]){out[id]={pid:id,member:isMember(s,id),att:0,paid:0,ball:0,unpaid:0};ids.push(id)}};
  s.members.forEach(addId);
  state.people.forEach(p=>{if(s.dates.some(d=>getSess(s,d).att?.[p.id])||s.carry[p.id])addId(p.id)});
  for(const d of s.dates){const x=getSess(s,d);const sh=share(s,d);for(const id in (x.att||{})){addId(id);const o=out[id];o.att++;o.ball+=sh;if(!o.member){const p=x.att[id].paid||0;o.paid+=p;if(p<fee())o.unpaid+=fee()-p}}}
  for(const id of ids){const o=out[id];o.carry=s.carry[id]||0;
    o.ballPaid=!!(s.settle&&s.settle[id]&&s.settle[id].ballPaid);const ballOwed=o.ballPaid?0:o.ball;
    if(o.member){o.fee=memberFee(s,id);o.feePaid=s.feePaid[id]||0;o.slots=Math.round(o.fee/fee());o.remain=o.slots-o.att;o.due=Math.max(0,o.fee-o.carry-o.feePaid);o.balance=o.carry+o.feePaid-o.att*fee()-ballOwed}
    else{o.balance=o.carry+o.paid-o.att*fee()-ballOwed}
    const st=(s.settle&&s.settle[id])||{};o.done=false;o.stale=false;
    if(st.done){if(st.pre!=null&&Math.round(o.balance)===Math.round(st.pre)){o.done=true;o.cash=-st.pre;o.balance=0}else o.stale=true}}
  return {ids,out};
}
function findPerson(nm){const k=norm(nm);return state.people.find(p=>norm(p.name)===k||(p.aliases||[]).some(a=>norm(a)===k))}
function findOrCreate(nm){let p=findPerson(nm);if(!p){p={id:uid(),name:nm.trim(),aliases:[]};state.people.push(p)}return p}
function pickDate(s){if(ui.date&&s.dates.includes(ui.date))return ui.date;const t=today();ui.date=s.dates.find(d=>d>=t)||s.dates[s.dates.length-1]||null;return ui.date}
function genDates(start,n){const a=[];for(let i=0;i<n;i++)a.push(addDays(start,i*7));return a}
function genDatesSkip(start,n,skipSet){const a=[];let d=start,guard=0;while(a.length<n&&guard<300){if(!skipSet.has(d))a.push(d);d=addDays(d,7);guard++}return a}

/* ---------- Taiwan holidays (hints only: 調整放假/補班 still need a human check) ---------- */
const HOL_FIXED={'01-01':'元旦','02-28':'和平紀念日','04-04':'兒童節','04-05':'清明節','05-01':'勞動節','09-28':'教師節','10-10':'國慶日','10-25':'光復節','12-25':'行憲紀念日'};
let _lunarFmt=null;
function lunarOf(d){
  try{
    if(!_lunarFmt)_lunarFmt=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric',timeZone:'UTC'});
    const p=_lunarFmt.formatToParts(new Date(d+'T12:00:00Z'));
    const m=p.find(x=>x.type==='month'),dd=p.find(x=>x.type==='day');
    if(!m||!dd)return null;
    return {m:parseInt(m.value,10),d:parseInt(dd.value,10),leap:!/^\d+$/.test(m.value)};
  }catch(e){return null}
}
function baseHoliday(d){
  const fx=HOL_FIXED[d.slice(5)];if(fx)return fx;
  const L=lunarOf(d);if(!L||L.leap)return null;
  if(L.m===1&&L.d<=3)return '春節';
  if(L.m===5&&L.d===5)return '端午節';
  if(L.m===8&&L.d===15)return '中秋節';
  const nx=lunarOf(addDays(d,1));if(nx&&!nx.leap&&nx.m===1&&nx.d===1)return '除夕';
  return null;
}
function holidayName(d){
  const b=baseHoliday(d);if(b)return b;
  const dow=dt(d).getUTCDay();
  if(dow===1){const p=baseHoliday(addDays(d,-1));if(p&&dt(addDays(d,-1)).getUTCDay()===0)return p+'補假'}
  if(dow===5){const n=baseHoliday(addDays(d,1));if(n&&dt(addDays(d,1)).getUTCDay()===6)return n+'補假'}
  return null;
}

/* ---------- date planner: first day + (count | last day), weekly, with holiday skipping ---------- */
function planNew(base){return Object.assign({start:'',mode:'count',count:12,end:'',skip:[],keep:[],autoHol:true},base||{})}
function planCalc(P){
  const dates=[],skipped=[];
  if(!P||!P.start)return {dates,skipped};
  const skipSet=new Set(P.skip||[]),keepSet=new Set(P.keep||[]);
  const n=Math.max(0,Math.floor(+P.count||0));
  let d=P.start,guard=0;
  while(guard<150){
    if(P.mode==='end'){if(!P.end||d>P.end)break}else if(dates.length>=n)break;
    const hol=holidayName(d);
    if(skipSet.has(d))skipped.push({d,why:hol||'手動跳過',manual:true});
    else if(P.autoHol&&hol&&!keepSet.has(d))skipped.push({d,why:hol,manual:false});
    else dates.push(d);
    d=addDays(d,7);guard++;
  }
  return {dates,skipped};
}
function planOf(kind){return kind==='qd'?ui.qd:ui.ns}
function planHtml(P,kind){
  const {dates,skipped}=planCalc(P);
  const k=`data-kind="${kind}"`;
  const chip=d=>{const h=holidayName(d);return `<button type="button" class="chip" data-act="planSkip" ${k} data-d="${d}">${md(d)}（週${wd(d)}）${h?`<small class="hol">${esc(h)}</small>`:''}</button>`};
  return `<div class="pform" style="padding-top:0">
    <label>第一天<input type="date" id="plan-start-${kind}" data-ch="plan" ${k} data-k="start" value="${esc(P.start)}"></label>
    ${P.mode==='end'
      ?`<label>最後一天<input type="date" id="plan-end-${kind}" data-ch="plan" ${k} data-k="end" value="${esc(P.end)}"></label>`
      :`<label>總共幾次（每週一次）<input type="number" inputmode="numeric" id="plan-count-${kind}" data-ch="plan" ${k} data-k="count" value="${esc(P.count)}"></label>`}
  </div>
  <div class="row-btns"><span class="seg"><button type="button" class="${P.mode==='count'?'on':''}" data-act="planMode" ${k} data-v="count">指定次數</button><button type="button" class="${P.mode==='end'?'on':''}" data-act="planMode" ${k} data-v="end">指定最後一天</button></span>
    <label class="ck"><input type="checkbox" id="plan-auto-${kind}" data-ch="planAuto" ${k} ${P.autoHol?'checked':''}>自動跳過國定假日</label></div>
  <p class="small">${dates.length?`每週${wd(dates[0])}，${md(dates[0])} – ${md(dates[dates.length-1])}，共 <b>${dates.length}</b> 次。`:'還沒有日期，請選第一天。'}</p>
  ${dates.length?`<div><h3>要打的日期（點一下可跳過該週）</h3><div class="chips" style="margin-top:6px">${dates.map(chip).join('')}</div></div>`:''}
  ${skipped.length?`<div><h3>已跳過（點一下可恢復）</h3><div class="chips" style="margin-top:6px">${skipped.map(x=>`<button type="button" class="chip skipped" data-act="planUnskip" ${k} data-d="${x.d}">${md(x.d)}（週${wd(x.d)}）<small class="hol">${esc(x.why)}</small> ✕</button>`).join('')}</div></div>`:''}
  <p class="muted small">假日只是依日曆推算的提示，補班或調整放假要自己再確認一下。</p>`;
}
function seasonName(dates){if(!dates.length)return '新的一季';const a=dt(dates[0]),b=dt(dates[dates.length-1]);const y1=a.getUTCFullYear(),y2=b.getUTCFullYear();return `${y1}/${a.getUTCMonth()+1} – ${y2!==y1?y2+'/':''}${b.getUTCMonth()+1}月（週${wd(dates[0])}）`}

/* ---------- backend (Google Apps Script) ----------
   Cross-origin fetch() to script.google.com hangs indefinitely on some
   mobile browsers/networks (a known rough edge of this combo), so reads
   go through JSONP (<script src>, never subject to CORS) and writes go
   through a hidden auto-submitting form targeting a hidden iframe (a
   plain form POST, also not subject to CORS). We can't read the iframe's
   response, so a write is followed by one JSONP read to confirm it took. */
let jsonpSeq=0;
function jsonpCall(url,params,timeoutMs){
  return new Promise((resolve,reject)=>{
    const cbName='bm_cb_'+(jsonpSeq++)+'_'+Date.now();
    const qs=Object.entries({...params,callback:cbName}).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject({kind:'timeout'})},timeoutMs||15000);
    function cleanup(){try{delete window[cbName]}catch(e){window[cbName]=undefined}script.remove();clearTimeout(timer)}
    window[cbName]=data=>{if(done)return;done=true;cleanup();resolve(data)};
    script.onerror=()=>{if(done)return;done=true;cleanup();reject({kind:'network'})};
    script.src=url+(url.includes('?')?'&':'?')+qs;
    document.head.appendChild(script);
  });
}
function formSubmit(url,fields){
  return new Promise(resolve=>{
    const frameName='bm_frame_'+Date.now();
    const ifr=document.createElement('iframe');
    ifr.name=frameName;ifr.style.display='none';
    document.body.appendChild(ifr);
    const form=document.createElement('form');
    form.method='POST';form.action=url;form.target=frameName;form.style.display='none';
    Object.entries(fields).forEach(([k,v])=>{const inp=document.createElement('input');inp.type='hidden';inp.name=k;inp.value=v==null?'':String(v);form.appendChild(inp)});
    document.body.appendChild(form);
    form.submit();
    setTimeout(()=>{form.remove();resolve()},200);
    setTimeout(()=>ifr.remove(),4000);
  });
}
async function apiGet(url,pw){
  const j=await jsonpCall(url,{action:'get',token:pw});
  if(!j||!j.ok)throw {kind:'api',error:(j&&j.error)||'unknown'};
  return j;
}
async function apiSet(data,expectedVersion){
  await formSubmit(CFG.url,{action:'set',token:CFG.pw,data:JSON.stringify(data),expectedVersion:expectedVersion==null?'':String(expectedVersion)});
  const base=expectedVersion==null?-1:expectedVersion;
  let j=null;
  // We can't read the form response, so check the server a few times to see whether the write landed.
  for(const wait of [900,1500,2500]){
    await new Promise(r=>setTimeout(r,wait));
    j=await apiGet(CFG.url,CFG.pw);
    if(j.version>base)break;
  }
  if(j.version<=base)return {ok:false,error:'notlanded',version:j.version};
  if(JSON.stringify(j.data)===JSON.stringify(data))return {ok:true,version:j.version};
  return {ok:false,error:'conflict',data:j.data,version:j.version};
}

function loadCache(){try{const t=localStorage.getItem('bm_cache');return t?JSON.parse(t):null}catch(e){return null}}

/* ---------- persistence ---------- */
let writing=false,dirty=false,timer=null,pollTimer=null;
function setSync(t){const el=$('#sync');if(el)el.textContent=t}
function save(msg){render();if(msg)toast(msg);
  dirty=true;clearTimeout(timer);timer=setTimeout(flush,350);setSync('儲存中…')}
async function flush(){
  if(writing)return;
  writing=true;
  try{
    // keep going until nothing is left unsaved, so taps made while a save is in flight are not dropped
    while(dirty){
      dirty=false;
      const snapshot=JSON.parse(JSON.stringify(state));
      let j;
      try{j=await apiSet(snapshot,version)}
      catch(e){
        dirty=true;
        if(e&&e.kind==='api'&&e.error==='bad_password'){setSync('密碼不對，請在「結算」清除登入設定重新輸入');return}
        setSync('離線中，稍後自動重試');
        setTimeout(flush,3000+Math.random()*1500);
        return;
      }
      if(j.ok){version=j.version;cacheState();setSync(dirty?'儲存中…':'已存到雲端');schedulePublish()}
      else if(j.error==='conflict'){state=normalize(j.data);version=j.version;dirty=false;cacheState();setSync('已存到雲端');toast('資料在別的裝置被更新了，已重新整理，請確認剛剛的修改還在');render()}
      else{dirty=true;setSync('儲存沒成功，稍後自動重試');setTimeout(flush,4000);return}
    }
  }finally{writing=false}
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(pollRefresh,25000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pollRefresh()});
  window.addEventListener('online',()=>{setSync('連線恢復');if(dirty)flush();else pollRefresh()});
  window.addEventListener('offline',()=>setSync('離線中'))}
async function pollRefresh(){if(!CFG||writing||dirty)return;
  try{const j=await apiGet(CFG.url,CFG.pw);
    if(j.ok&&(j.version!==version||mode==='offline')){mode='cloud';state=normalize(j.data);version=j.version;cacheState();render();setSync('已存到雲端');schedulePublish()}
    if(ui.tab==='session')loadSignups()}
  catch(e){}}

let lastPub='',pubT=null;
function schedulePublish(){clearTimeout(pubT);pubT=setTimeout(()=>publishSnap(false),2500)}
function codeKey(p){return norm(p.code||'')}
function dupCodes(){const seen={},dup=new Set();state.people.forEach(p=>{const k=codeKey(p);if(!k)return;if(seen[k])dup.add(k);seen[k]=1});return dup}
function buildSnapshot(){
  if(!state||!state.seasons||!state.seasons.length)return null;
  const s=S();const {out}=calc(s);const t=today();const nx=s.dates.find(d=>d>t);const dup=dupCodes();
  const people={};
  state.people.forEach(p=>{const k=codeKey(p);if(!k||dup.has(k))return;
    const o=out[p.id];
    const rows=s.dates.filter(d=>getSess(s,d).att?.[p.id]).map(d=>({d:md(d),ball:share(s,d)}));
    const member=!!(o&&o.member);
    people[k]={name:p.name,role:member?'member':'guest',att:rows.length,rows,
      court:rows.length*fee(),ball:o?o.ball:0,ballPaid:!!(o&&o.ballPaid),
      paid:o?(member?o.feePaid:o.paid):0,carry:o?o.carry:0,balance:o?Math.round(o.balance):0,
      remain:member?o.remain:null,seasonFee:member?o.fee:null,done:!!(o&&o.done)}});
  const open=!(state.signup&&state.signup.open===false);
  return {updated:Date.now(),season:s.name,
    rates:{court:rt('court',s),fee:fee(),ballPrice:Math.round(ballPrice()*100)/100,cap:rt('cap',s)},
    sessions:{total:s.dates.length,played:s.dates.filter(d=>d<=t&&Object.keys(getSess(s,d).att||{}).length).length},
    event:nx?{date:nx,label:`${md(nx)}（週${wd(nx)}）`,cap:rt('cap',s),open}:null,
    people};
}

function vRenew(s){

/* ---------- actions ---------- */
function doParse(s){
  const main=[],backup=[];let date=null;const seen=new Set();
  const clean=t=>t.replace(/^[\s.．、:：)\-]+/,'').trim();
  for(const raw of ui.lineText.split(/\r?\n/)){const L=raw.trim();if(!L)continue;let m;
    if((m=L.match(/^備\s*(\d{1,2})\s*[.．、:：)\-]?\s*(.*)$/))){const nm=clean(m[2]);if(nm&&nm!=='名字'&&!seen.has(norm(nm))){seen.add(norm(nm));backup.push(nm)}continue}
    if((m=L.match(/^(\d{1,2})\s*[.．、)]\s*(.*)$/))){const nm=clean(m[2]);if(nm&&nm!=='名字'&&!seen.has(norm(nm))){seen.add(norm(nm));main.push(nm)}continue}
    if(!date&&(m=L.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/)))date={m:+m[1],d:+m[2]};
  }
  let key=null;
  if(date){key=s.dates.find(x=>{const p=x.split('-');return +p[1]===date.m&&+p[2]===date.d});
    if(!key){const base=s.dates[0]?dt(s.dates[0]):new Date();let y=base.getUTCFullYear();if(s.dates[0]&&date.m<base.getUTCMonth()+1-6)y++;key=`${y}-${String(date.m).padStart(2,'0')}-${String(date.d).padStart(2,'0')}`}}
  const mk=nm=>{const p=findPerson(nm);return {name:nm,pid:p?p.id:null,choice:'new'}};
  ui.parse={date:key||pickDate(s),main:main.map(mk),backup:backup.map(mk)};
}
function resolveRow(r){if(r.pid)return r.pid;if(r.choice==='skip')return null;
  if(r.choice==='new'){const p=findOrCreate(r.name);return p.id}
  const p=state.people.find(q=>q.id===r.choice);if(!p)return null;
  if(norm(p.name)!==norm(r.name)&&!(p.aliases||[]).some(a=>norm(a)===norm(r.name)))p.aliases=[...(p.aliases||[]),r.name];return p.id}
function doApply(s){const P=ui.parse;const d=P.date;
  if(!s.dates.includes(d)){s.dates.push(d);s.dates.sort()}
  const x=sess(s,d);const att={};
  P.main.forEach(r=>{const id=resolveRow(r);if(id&&!att[id])att[id]=x.att[id]||(isMember(s,id)?{}:{paid:0})});
  x.att=att;x.backup=P.backup.map(resolveRow).filter(id=>id&&!att[id]);
  ui.date=d;ui.parse=null;ui.lineText='';save(`已設定 ${md(d)} 出席 ${Object.keys(att).length} 人`);
}
function cycleCell(s,id,d){const x=sess(s,d);const a=x.att[id];
  if(isMember(s,id)){if(a)delete x.att[id];else x.att[id]={}}
  else if(!a)x.att[id]={paid:fee()};else if((a.paid||0)>=fee())x.att[id]={paid:0};else delete x.att[id];
  save()}
function act0(a,el){

    case 'add':{const x=sess(s,ui.date);if(!x.att[id])x.att[id]=isMember(s,id)?{}:{paid:0};save();break}
    case 'pay':{const x=sess(s,ui.date);const t=x.att[id];t.paid=(t.paid||0)>=fee()?0:fee();save();break}
    case 'payAll':{const x=sess(s,ui.date);for(const k in x.att)if(!isMember(s,k)&&(x.att[k].paid||0)<fee())x.att[k].paid=fee();save('臨打都記為已收');break}
    case 'ball':{const x=sess(s,ui.date);x.balls=Math.max(0,(x.balls||0)+(+el.dataset.v));save();break}
    case 'addGuest':{const nm=$('#guestName').value.trim();if(!nm)return;const p=findOrCreate(nm);const x=sess(s,ui.date);if(!x.att[p.id])x.att[p.id]=isMember(s,p.id)?{}:{paid:0};save(`已加入 ${p.name}`);break}
    case 'delDate':{const d=el.dataset.d;s.dates=s.dates.filter(x=>x!==d);delete s.sessions[d];ui.date=null;save(`已移除 ${md(d)}`);break}
    case 'cell':cycleCell(s,id,el.dataset.d);break;
    case 'open':ui.open=ui.open===id?null:id;render();break;
    case 'feeFull':{const o=calc(s).out[id];s.feePaid[id]=(s.feePaid[id]||0)+o.due;save(`${pname(id)} 季費已繳清`);break}
    case 'delPerson':{const used=state.seasons.some(x=>x.members.includes(id)&&x.id!==s.id||Object.values(x.sessions).some(q=>q.att&&q.att[id]));if(used){toast('這個人在其他季有紀錄，不能刪除');return}
      s.members=s.members.filter(x=>x!==id);state.people=state.people.filter(p=>p.id!==id);ui.open=null;save('已刪除');break}
    case 'mkMember':{if(!s.members.includes(id))s.members.push(id);save(`${pname(id)} 設為季費會員`);break}
    case 'newPerson':{const nm=$('#newName').value.trim();if(!nm)return;if(findPerson(nm)){toast('已經有這個人了');return}const p=findOrCreate(nm);if($('#newRole').value==='m')s.members.push(p.id);save(`已新增 ${nm}`);break}
    case 'addPurchase':{const n=+$('#buyN').value,pr=+$('#buyP').value,d=$('#buyDate').value||today();if(!(n>0))return;s.purchases.push({date:d,buckets:n,price:pr||state.settings.bucketPrice});s.purchases.sort((a,b)=>a.date<b.date?-1:1);save('已記錄');break}
    case 'delPurchase':s.purchases.splice(+el.dataset.i,1);save();break;
    case 'renew':{const cur=(s.settle[id]||{}).renew,v=el.dataset.v==='1';s.settle[id]={...(s.settle[id]||{}),renew:cur===v?undefined:v};save();break}
    case 'smode':ui.sm=el.dataset.v;render();window.scrollTo(0,0);break;
    case 'ballPaid':{const st=s.settle[id]||{};if(calc(s).out[id]?.done){toast('他已結清，球錢已算在內。要改的話請先到完整結算取消結清');return}s.settle[id]={...st,ballPaid:!st.ballPaid};save();break}
    case 'ballAll':{const on=el.dataset.v==='1';ballRows(s).forEach(r=>{const st=s.settle[r.id]||{};s.settle[r.id]={...st,ballPaid:on}});save(on?'都標示為已收':'都改回未收');break}
    case 'copyMsg':{const t=personMsg(s,id);navigator.clipboard.writeText(t).then(()=>toast('已複製，貼給他就可以了'),()=>toast('這個畫面不能複製'));break}
    case 'copyBall':{const t=ballMessage(s);navigator.clipboard.writeText(t).then(()=>toast('已複製，貼到 LINE 就可以了'),()=>toast('這個畫面不能複製'));break}
    case 'newSeason':ui.ns=nsDefaults(s);ui.sm='full';render();{const c=document.getElementById('ns-card');if(c)c.scrollIntoView()}break;
    case 'cancelNs':ui.ns=null;render();break;
    case 'planSkip':{const P=planOf(el.dataset.kind),d=el.dataset.d;if(!P)break;P.keep=(P.keep||[]).filter(x=>x!==d);if(!(P.skip||[]).includes(d))P.skip=[...(P.skip||[]),d];render();break}
    case 'planUnskip':{const P=planOf(el.dataset.kind),d=el.dataset.d;if(!P)break;
      if((P.skip||[]).includes(d))P.skip=P.skip.filter(x=>x!==d);
      if(P.autoHol&&holidayName(d)&&!(P.keep||[]).includes(d))P.keep=[...(P.keep||[]),d];
      render();break}
    case 'planMode':{const P=planOf(el.dataset.kind);if(!P)break;P.mode=el.dataset.v;
      if(P.mode==='end'&&!P.end){const ds=planCalc({...P,mode:'count'}).dates;P.end=ds.length?ds[ds.length-1]:P.start}
      render();break}
    case 'qdOpen':{let start=today();if(s&&s.dates.length)start=addDays(s.dates[s.dates.length-1],7);ui.qd=planNew({start});render();break}
    case 'qdClose':ui.qd=null;render();break;
    case 'qdApply':{const fresh=planCalc(ui.qd).dates.filter(d=>!s.dates.includes(d));if(!fresh.length)break;
      s.dates=[...s.dates,...fresh].sort();ui.date=fresh[0];ui.qd=null;ui.centerDate=true;save(`已加入 ${fresh.length} 個日期`);break}
    case 'createSeason':createSeason(s);break;
    case 'copy':{const t=JSON.stringify(state);navigator.clipboard.writeText(t).then(()=>toast('已複製，可貼到記事本保存'),()=>toast('這個畫面不能複製'));break}
    case 'logout':{try{localStorage.removeItem('bm_cfg')}catch(e){}location.reload();break}
  }
}
function createSeason(old){const N=ui.ns;const dates=planCalc(N).dates;if(!dates.length){toast('請先選好第一天和次數（或最後一天）');return}
  const ns={id:uid(),name:N.name.trim()||seasonName(dates),closed:false,dates,members:[...N.members],memberFee:{},feePaid:{},carry:{},sessions:{},purchases:[],settle:{},rates:Object.fromEntries(RATE_KEYS.map(k=>[k,state.settings[k]]))};
  ns.members.forEach(id=>ns.memberFee[id]=dates.length*ns.rates.court/ns.rates.cap);
  if(old){const {ids,out}=calc(old);ids.forEach(id=>{const b=Math.round(out[id].balance);if(!out[id].done&&b!==0)ns.carry[id]=b});old.closed=true}
  state.seasons.push(ns);state.cur=ns.id;ui.ns=null;ui.date=null;ui.tab='people';save('新的一季建立好了');window.scrollTo(0,0)}
function change0(el){
  const k=el.dataset.ch;const s=state&&state.seasons.length?S():null;const id=el.dataset.id;const num=()=>Math.round(+el.value||0);
  switch(k){
    case 'season':state.cur=el.value;ui.date=null;ui.ns=null;render();save();break;
    case 'amt':{const x=sess(s,ui.date);if(x.att[id]){x.att[id].paid=Math.max(0,num());save()}break}
    case 'addDate':{const d=el.value;if(d&&!s.dates.includes(d)){s.dates.push(d);s.dates.sort();ui.date=d;save(`已加入 ${md(d)}`)}break}
    case 'pdate':ui.parse.date=el.value;break;
    case 'pchoice':ui.parse[el.dataset.list][+el.dataset.i].choice=el.value;break;
    case 'pname':{const v=el.value.trim();if(v){person(id).name=v;save()}break}
    case 'palias':person(id).aliases=el.value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean);save();break;
    case 'prole':{if(el.value==='m'){if(!s.members.includes(id))s.members.push(id);for(const d in s.sessions){const a=s.sessions[d].att?.[id];if(a)s.sessions[d].att[id]={}}}else s.members=s.members.filter(x=>x!==id);save();break}
    case 'pfee':s.memberFee[id]=num();save();break;
    case 'ppaid':s.feePaid[id]=num();save();break;
    case 'pcarry':{const v=num();if(v)s.carry[id]=v;else delete s.carry[id];save();break}
    case 'done':{
      const st=s.settle[id]||{};
      if(el.checked){
        const o0=calc(s).out[id];const snap=st.snap||{paid:{}};
        if(o0.member){if(o0.due>0){if(snap.feePaid==null)snap.feePaid=s.feePaid[id]||0;s.feePaid[id]=(s.feePaid[id]||0)+o0.due}}
        else s.dates.forEach(d=>{const a=getSess(s,d).att?.[id];if(a&&(a.paid||0)<fee()){if(!(d in snap.paid))snap.paid[d]=a.paid||0;a.paid=fee()}});
        s.settle[id]={...st,done:false,snap};
        const pre=calc(s).out[id].balance;
        s.settle[id]={...st,done:true,pre,snap};
        save(`${pname(id)} 已結清，出席表和成員已同步更新`);
      }else{
        const snap=st.snap;
        if(snap){for(const d in snap.paid){const a=getSess(s,d).att?.[id];if(a)a.paid=snap.paid[d]}
          if(snap.feePaid!=null){if(snap.feePaid>0)s.feePaid[id]=snap.feePaid;else delete s.feePaid[id]}}
        const n={...st,done:false};delete n.pre;delete n.snap;s.settle[id]=n;
        save(`${pname(id)} 已取消結清，已還原收款紀錄`);
      }
      break}
    case 'pcode':{const v=el.value.trim();const k=norm(v);
      if(k){const dup=state.people.find(q=>q.id!==id&&codeKey(q)===k);if(dup){toast(`代碼「${v}」已經被 ${dup.name} 使用，請換一個`);render();return}}
      person(id).code=v;save(v?'代碼已更新':'代碼已清除');break}
    case 'set':{const v=+el.value;if(v>0){state.settings[el.dataset.k]=v;if(s){s.rates=s.rates||{};s.rates[el.dataset.k]=v}save()}break}
    case 'ns':ui.ns[el.dataset.k]=el.value;if(el.dataset.k!=='name')render();break;
    case 'plan':{const P=planOf(el.dataset.kind);if(!P)break;P[el.dataset.k]=el.value;render();break}
    case 'planAuto':{const P=planOf(el.dataset.kind);if(!P)break;P.autoHol=el.checked;if(P.autoHol)P.keep=[];render();break}
    case 'nsMem':{const m=ui.ns.members;if(el.checked){if(!m.includes(id))m.push(id)}else ui.ns.members=m.filter(x=>x!==id);render();break}
  }
}
/* ---------- undo: snapshot before every edit that actually changes data ---------- */
const undoStack=[];
const NOUNDO=new Set(['tab','date','parse','cancelParse','open','smode','qdOpen','qdClose','planSkip','planUnskip','planMode','copy','copyBall','copyMsg','logout','newSeason','goPerson','undo','suRefresh','suLink']);
function renderUndo(){const b=$('#undo');if(b)b.hidden=!(loaded&&undoStack.length)}
function withUndo(fn){
  if(!state||!state.seasons)return fn();
  const before=JSON.stringify(state);fn();
  try{if(state&&JSON.stringify(state)!==before){undoStack.push(before);if(undoStack.length>25)undoStack.shift();renderUndo()}}catch(e){}
}
function doUndo(){
  const b=undoStack.pop();if(!b){renderUndo();return}
  state=normalize(JSON.parse(b));if(!state.seasons.find(x=>x.id===state.cur))state.cur=state.seasons.length?state.seasons[state.seasons.length-1].id:null;
  save('已復原上一步');renderUndo();
}
function act(a,el){if(a==='undo')return doUndo();if(NOUNDO.has(a))return act0(a,el);withUndo(()=>act0(a,el))}
function change(el){if(el.dataset.ch==='season'||el.dataset.ch==='plan'||el.dataset.ch==='planAuto')return change0(el);withUndo(()=>change0(el))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!(b.tagName==='LABEL')){act(b.dataset.act,b)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();act(e.target.dataset.act,e.target)}
  if(e.key==='Enter'&&e.target.id==='guestName')act('addGuest',e.target);if(e.key==='Enter'&&e.target.id==='newName')act('newPerson',e.target)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el)change(el)});
document.addEventListener('input',e=>{if(e.target.dataset.in==='line')ui.lineText=e.target.value});

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})}
boot();
</script>
